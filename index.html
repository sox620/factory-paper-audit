<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>PAS-X Label Audit - iPhone Debug</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%;background:#f5f6fa}body{margin:0;background:#f5f6fa;color:#17171a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45;overflow-x:hidden}button,input,select,textarea{font:inherit}button{touch-action:manipulation;cursor:pointer;border:0}.app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(132px + env(safe-area-inset-bottom))}.title{font-size:22px;font-weight:800;margin:6px 4px 2px}.sub{font-size:13px;color:#666;margin:0 4px 12px}.card,.finding,.metric{background:#fff;border:1px solid #d9dce3;border-radius:16px;box-shadow:0 1px 2px rgba(0,0,0,.05);}.card{padding:16px}.field{margin-bottom:14px}.field label{display:block;font-size:13px;font-weight:700;color:#686b73;margin-bottom:6px}input,select,textarea{width:100%;min-height:48px;border:1px solid #cfd3dc;border-radius:14px;background:#fff;padding:12px 13px;font-size:16px!important;-webkit-appearance:none;appearance:none}textarea{min-height:112px}.save,.action{width:100%;min-height:52px;border-radius:14px;font-size:16px;font-weight:800}.save{background:#534AB7;color:#fff}.action{background:#fff;border:1px solid #d9dce3;text-align:left;padding:0 14px;margin-top:10px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(245,246,250,.96);border-top:1px solid rgba(0,0,0,.08)}.nav button{min-height:54px;border-radius:14px;background:transparent;color:#686b73;font-size:12px;font-weight:700}.nav button.active{background:#ebe9ff;color:#302887}.section{display:none}.section.active{display:block}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.metric{padding:14px}.metric-val{font-size:28px;font-weight:800}.metric-lbl{font-size:12px;color:#686b73}.finding{padding:14px;margin-bottom:10px}.top{display:flex;justify-content:space-between;gap:10px}.loc{font-weight:800;overflow-wrap:anywhere}.room,.detail,.meta{font-size:13px;color:#686b73;overflow-wrap:anywhere}.badge{display:inline-block;margin-top:6px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#F1EFE8;color:#444}.b-pasx{background:#EEEDFE;color:#3C3489}.b-sop{background:#E1F5EE;color:#085041}.b-missing{background:#FAEEDA;color:#633806}.b-access{background:#FAECE7;color:#712B13}.b-printer-fixed{background:#E8F2FF;color:#174A7C}.b-training{background:#FBEAF0;color:#72243E}.del{font-size:30px;min-width:42px;min-height:42px;color:#777}.empty{text-align:center;color:#686b73;padding:34px 10px}.barrow{margin-bottom:14px}.barlbl{font-size:13px;color:#686b73;font-weight:700}.track{height:14px;background:#eef0f4;border-radius:999px;overflow:hidden;margin:7px 0}.fill{height:100%;border-radius:999px}.toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:80;background:#302887;color:#fff;text-align:center;padding:12px;border-radius:14px;font-weight:700;opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.debug{position:fixed;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;background:#111;color:#00ff90;border-radius:10px;padding:8px;font:12px/1.35 Menlo,Consolas,monospace;max-height:145px;overflow:auto;box-shadow:0 4px 18px rgba(0,0,0,.3)}.debug b{color:#fff}.debugline{border-top:1px solid #333;padding-top:3px;margin-top:3px}.rc-title{font-size:13px;font-weight:800;color:#686b73;text-transform:uppercase;margin:0 0 12px}@media(max-width:360px){.metrics{grid-template-columns:1fr}.title{font-size:20px}}
</style>
</head>
<body>
<div class="toast" id="toast">Ready</div>
<div class="app">
<h1 class="title">PAS-X Label Audit</h1><p class="sub">iPhone debug version — debug panel is enabled by default.</p>
<section id="tab-log" class="section active"><div class="card">
<div class="field"><label>Facility / site *</label><input id="f-facility" placeholder="e.g. Unit 1"></div>
<div class="field"><label>Room / location *</label><input id="f-room" placeholder="e.g. G35"></div>
<div class="field"><label>Label description</label><input id="f-label" placeholder="e.g. Room label"></div>
<div class="field"><label>Root cause *</label><select id="f-rootcause"><option value="">— select —</option><option value="pasx_cant_print">PAS-X can't print this label type</option><option value="sop_mandates">SOP mandates manual label</option><option value="pasx_missing_field">PAS-X label missing required info</option><option value="access_workaround">No printer access / old habit</option><option value="printer_fixed">Printer wasn't working — now fixed</option><option value="training_gap">Operator unaware PAS-X can do this</option><option value="other">Other</option></select></div>
<div class="field"><label>Detail / evidence</label><textarea id="f-detail" placeholder="What exactly happened?"></textarea></div>
<div class="field"><label>Priority</label><select id="f-priority"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select></div>
<div class="field"><label>Observer</label><input id="f-observer" placeholder="Your initials"></div>
<div class="field"><label>Date</label><input type="date" id="f-date"></div>
<button class="save" id="btn-save" type="button">＋ Save finding</button>
</div></section>
<section id="tab-findings" class="section"><div class="metrics"><div class="metric"><div id="m-total" class="metric-val">0</div><div class="metric-lbl">Total findings</div></div><div class="metric"><div id="m-high" class="metric-val" style="color:#E24B4A">0</div><div class="metric-lbl">High priority</div></div><div class="metric"><div id="m-fac" class="metric-val">0</div><div class="metric-lbl">Facilities</div></div><div class="metric"><div id="m-rc" class="metric-val">0</div><div class="metric-lbl">Root causes</div></div></div><div id="findings-list"><p class="empty">No findings yet — log your first one</p></div><button class="action" id="btn-export" type="button">⬇ Export CSV</button><button class="action" id="btn-clear" type="button">🗑 Clear saved findings</button></section>
<section id="tab-analysis" class="section"><div class="card"><div class="rc-title">Root causes</div><div id="rc-chart"><p class="empty">Add findings to see breakdown</p></div></div><br><div class="card"><div class="rc-title">By facility</div><div id="fac-chart"><p class="empty">Add findings to see breakdown</p></div></div></section>
</div>
<nav class="nav"><button id="nb-log" class="active" type="button">📝<br>Log</button><button id="nb-findings" type="button">📋<br>Findings</button><button id="nb-analysis" type="button">📊<br>Analysis</button></nav>
<div class="debug" id="debug"><b>Debug:</b> loading…</div>
<script>
(function(){
var DEBUG=true, findings=[], STORAGE_KEY='pasxAudit.debug.findings.v3', DRAFT_KEY='pasxAudit.debug.draft.v3';
var RC={pasx_cant_print:{label:"PAS-X can't print type",cls:'b-pasx',color:'#7F77DD'},sop_mandates:{label:'SOP mandates manual',cls:'b-sop',color:'#1D9E75'},pasx_missing_field:{label:'PAS-X missing info',cls:'b-missing',color:'#EF9F27'},access_workaround:{label:'No printer/habit',cls:'b-access',color:'#D85A30'},printer_fixed:{label:'Printer fixed',cls:'b-printer-fixed',color:'#378ADD'},training_gap:{label:'Operator unaware',cls:'b-training',color:'#D4537E'},other:{label:'Other',cls:'b-other',color:'#888780'}};
var PC={high:'#E24B4A',medium:'#EF9F27',low:'#639922'};
function E(id){return document.getElementById(id)} function V(id){var x=E(id);return x?x.value:''}
function log(m){var d=E('debug'); if(d){var div=document.createElement('div');div.className='debugline';div.appendChild(document.createTextNode(new Date().toLocaleTimeString()+': '+m));d.appendChild(div);d.scrollTop=d.scrollHeight;} }
window.onerror=function(msg,url,line,col,err){log('ERROR: '+msg+' line '+line); alert('Debug error: '+msg+' line '+line); return false;};
function toast(m){var t=E('toast');t.innerHTML=m;t.className='toast show';setTimeout(function(){t.className='toast'},2200);log('Toast: '+m)}
function today(){var d=new Date(),tz=d.getTimezoneOffset()*60000;return new Date(d-tz).toISOString().slice(0,10)}
function hasStorage(){try{localStorage.setItem('t','1');localStorage.removeItem('t');return true}catch(e){log('Storage unavailable: '+e.message);return false}}
function load(){if(!hasStorage())return [];try{var s=localStorage.getItem(STORAGE_KEY);return s?JSON.parse(s):[]}catch(e){log('Load fail: '+e.message);return []}}
function save(){if(hasStorage()){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(findings));log('Saved '+findings.length+' findings')}catch(e){toast('Storage full')}}}
function saveDraft(){if(hasStorage()){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({facility:V('f-facility'),room:V('f-room'),label:V('f-label'),rootcause:V('f-rootcause'),detail:V('f-detail'),priority:V('f-priority'),observer:V('f-observer'),date:V('f-date')}))}catch(e){}}}
function restoreDraft(){if(!hasStorage())return false;try{var s=localStorage.getItem(DRAFT_KEY);if(!s)return false;var d=JSON.parse(s),m={facility:'f-facility',room:'f-room',label:'f-label',rootcause:'f-rootcause',detail:'f-detail',priority:'f-priority',observer:'f-observer',date:'f-date'},k;for(k in m){if(E(m[k])&&d[k]!==undefined)E(m[k]).value=d[k]}return true}catch(e){log('Draft restore fail: '+e.message);return false}}
function clearDraft(){try{localStorage.removeItem(DRAFT_KEY)}catch(e){}}
function showTab(t){log('Tab tapped: '+t);var a=['log','findings','analysis'],i;for(i=0;i<a.length;i++){E('tab-'+a[i]).className='section'+(a[i]===t?' active':'');E('nb-'+a[i]).className=(a[i]===t?'active':'')}if(t==='findings')renderFindings();if(t==='analysis')renderAnalysis();window.scrollTo(0,0)}
function addFinding(){log('Save button tapped');var f={facility:V('f-facility').replace(/^\s+|\s+$/g,''),room:V('f-room').replace(/^\s+|\s+$/g,''),label:V('f-label').replace(/^\s+|\s+$/g,''),rootcause:V('f-rootcause'),detail:V('f-detail').replace(/^\s+|\s+$/g,''),priority:V('f-priority')||'medium',observer:V('f-observer').replace(/^\s+|\s+$/g,''),date:V('f-date')||today(),id:(new Date()).getTime()};if(!f.facility||!f.room||!f.rootcause){toast('Fill facility, room & root cause');return}findings.push(f);save();updateMetrics();E('f-room').value='';E('f-label').value='';E('f-detail').value='';E('f-rootcause').value='';E('f-priority').value='medium';E('f-date').value=today();clearDraft();toast('Finding saved');showTab('findings')}
function renderFindings(){var x=E('findings-list'),i,html='',f,rc;if(!findings.length){x.innerHTML='<p class="empty">No findings yet — log your first one</p>';return}for(i=findings.length-1;i>=0;i--){f=findings[i];rc=RC[f.rootcause]||{label:f.rootcause,cls:'b-other'};html+='<div class="finding"><div class="top"><div><div class="loc">'+esc(f.facility)+'</div><div class="room">'+esc(f.room)+(f.label?' · '+esc(f.label):'')+'</div></div><button class="del" data-id="'+f.id+'" type="button">×</button></div><span class="badge '+rc.cls+'">'+esc(rc.label)+'</span>'+(f.detail?'<div class="detail">'+esc(f.detail)+'</div>':'')+'<div class="meta">'+(f.observer?esc(f.observer)+' · ':'')+esc(f.date)+'</div></div>'}x.innerHTML=html}
function del(id){var n=[],i;for(i=0;i<findings.length;i++){if(String(findings[i].id)!==String(id))n.push(findings[i])}findings=n;save();updateMetrics();renderFindings();toast('Deleted')}
function updateMetrics(){var fac={},rc={},high=0,i,f;for(i=0;i<findings.length;i++){f=findings[i];if(f.priority==='high')high++;fac[f.facility]=1;rc[f.rootcause]=1}E('m-total').innerHTML=findings.length;E('m-high').innerHTML=high;E('m-fac').innerHTML=countKeys(fac);E('m-rc').innerHTML=countKeys(rc)}
function countKeys(o){var c=0,k;for(k in o){if(o.hasOwnProperty(k))c++}return c}
function renderAnalysis(){renderBars('rc-chart',countBy('rootcause'),true);renderBars('fac-chart',countBy('facility'),false)}
function countBy(prop){var o={},i,k;for(i=0;i<findings.length;i++){k=findings[i][prop]||'';o[k]=(o[k]||0)+1}return o}
function renderBars(id,o,isRc){var x=E(id),k,max=0,html='',m,c;if(!findings.length){x.innerHTML='<p class="empty">Add findings to see breakdown</p>';return}for(k in o){if(o[k]>max)max=o[k]}for(k in o){c=o[k];m=isRc?(RC[k]||{label:k,color:'#888'}):{label:k,color:'#378ADD'};html+='<div class="barrow"><div class="barlbl">'+esc(m.label)+'</div><div class="track"><div class="fill" style="width:'+Math.round(c/max*100)+'%;background:'+m.color+'"></div></div><b>'+c+'</b></div>'}x.innerHTML=html}
function exportCSV(){if(!findings.length){toast('No findings to export');return}var h=['Facility','Room','Label','Root cause','Priority','Detail','Observer','Date'],rows=[h.join(',')],i,f;for(i=0;i<findings.length;i++){f=findings[i];rows.push([f.facility,f.room,f.label,(RC[f.rootcause]?RC[f.rootcause].label:f.rootcause),f.priority,f.detail,f.observer,f.date].map(csv).join(','))}download('pasx_label_audit.csv',rows.join('\n'),'text/csv;charset=utf-8')}
function download(name,content,type){var blob=new Blob([content],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.parentNode.removeChild(a)},500);log('Export triggered: '+name)}
function clearAll(){if(confirm('Clear all saved findings?')){findings=[];save();updateMetrics();renderFindings();renderAnalysis();toast('All cleared')}}
function csv(v){return '"'+String(v||'').replace(/"/g,'""')+'"'} function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function bind(){E('btn-save').addEventListener('click',addFinding,false);E('nb-log').addEventListener('click',function(){showTab('log')},false);E('nb-findings').addEventListener('click',function(){showTab('findings')},false);E('nb-analysis').addEventListener('click',function(){showTab('analysis')},false);E('btn-export').addEventListener('click',exportCSV,false);E('btn-clear').addEventListener('click',clearAll,false);E('findings-list').addEventListener('click',function(e){var t=e.target;if(t&&t.getAttribute('data-id'))del(t.getAttribute('data-id'))},false);var ids=['f-facility','f-room','f-label','f-rootcause','f-detail','f-priority','f-observer','f-date'],i;for(i=0;i<ids.length;i++){E(ids[i]).addEventListener('input',saveDraft,false);E(ids[i]).addEventListener('change',saveDraft,false)}log('Events bound successfully')}
function init(){log('DOM ready. UserAgent: '+navigator.userAgent);findings=load();if(restoreDraft())toast('Draft restored');if(!V('f-date'))E('f-date').value=today();bind();updateMetrics();renderFindings();log('Initialised with '+findings.length+' findings')}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init,false)}else{init()}
})();
</script>
</body>
</html>
